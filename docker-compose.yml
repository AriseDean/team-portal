name: team-portal

services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - portal_data:/data          # database, uploaded reports, backups
    ports:
      - "127.0.0.1:${PORT:-8000}:8000"   # local only: put a reverse proxy in front (see README)

  # Optional bundled HTTPS proxy. Start with:  docker compose --profile caddy up -d
  # Skip it if you already run nginx / Traefik / Caddy on this server.
  caddy:
    image: caddy:2-alpine
    profiles: ["caddy"]
    restart: unless-stopped
    depends_on: [web]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  portal_data:
  caddy_data:
  caddy_config:
